name: airline-checkin

services:
  checkin:
    build: .
    image: airline-checkin-rpa:local
    init: true
    shm_size: 1gb
    env_file:
      - path: .env
        required: false
    environment:
      BROWSER_HEADLESS: "true"
    volumes:
      - ./data:/app/data
      - ./boarding_passes:/app/boarding_passes
    command: ["run"]
