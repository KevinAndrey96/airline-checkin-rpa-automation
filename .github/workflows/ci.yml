name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  quality:
    name: Calidad (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Check-in de punta a punta con Chromium
    runs-on: ubuntu-latest
    needs: quality
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t airline-checkin-rpa .
      - name: Validar el manifiesto de ejemplo dentro de la imagen
        run: docker run --rm airline-checkin-rpa validate --manifest examples/passengers.example.csv
      - name: Abrir Chromium como pwuser
        run: >-
          docker run --rm --init --entrypoint node airline-checkin-rpa --input-type=module
          -e "const { chromium } = await import('playwright'); const browser = await chromium.launch(); console.log('chromium', browser.version()); await browser.close();"
